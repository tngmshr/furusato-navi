<!DOCTYPE html>
<html lang="ja">

<title>ふるさと納税かんたんナビ</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta property="og:description" content="寄付から税金の手続き、翌年の確認まで。画面の案内どおりに進めるだけ。氏名や年収の入力はいりません。">
<meta property="og:url" content="https://tngmshr.github.io/furusato-navi/">

<meta name="twitter:card" content="summary_large_image">
<script>
/* LINE のアプリ内ブラウザは画面下が隠れて最後まで読めないため、外部ブラウザ（Safari / Chrome）で開き直す。
   openExternalBrowser=1 は LINE 公式のクエリパラメータ。付けても外に出られなかった場合は、下の余白を増やして案内を出す。 */
(function(){
  var inLine = /\bLine\//i.test(navigator.userAgent);
  var hasParam = /[?&]openExternalBrowser=1\b/.test(location.search);
  if (inLine && !hasParam) {
    location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash);
    return;
  }
  if (inLine) document.documentElement.classList.add('line');
  else if (hasParam && history.replaceState) {
    // 外部ブラウザで開けたら、URL からパラメータを消しておく
    var q = location.search.replace(/[?&]openExternalBrowser=1\b/, '').replace(/^&/, '?');
    history.replaceState(null, '', location.pathname + q + location.hash);
  }
})();
</script>
<style>
:root{
  --fs:17px;
  --bg:#f3f6fa; --card:#ffffff; --ink:#1b2733; --sub:#52616f; --line:#dde5ee;
  --blue:#1f6fd1; --blue-ink:#ffffff; --blue-soft:#e9f1fc; --blue-line:#b9d3f5;
  --green:#1d9a60; --green-soft:#e7f6ee;
  --gray:#c9d2dc; --gray-ink:#7a8794;
  --warn:#a45f00; --warn-soft:#fff4e2; --warn-line:#f2d19c;
  --shadow:0 1px 2px rgba(20,40,70,.06),0 4px 14px rgba(20,40,70,.06);
  --bar-bg:rgba(255,255,255,.94);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151c; --card:#18212b; --ink:#e8eef4; --sub:#a9b6c3; --line:#2a3642;
    --blue:#4b93ec; --blue-ink:#08111c; --blue-soft:#15273d; --blue-line:#2d4f78;
    --green:#3cc486; --green-soft:#12291f;
    --gray:#3a4653; --gray-ink:#8795a3;
    --warn:#f0b35a; --warn-soft:#2b2211; --warn-line:#5a4520;
    --shadow:none; --bar-bg:rgba(20,28,37,.94);
  }
}
:root[data-theme="dark"]{
  --bg:#0f151c; --card:#18212b; --ink:#e8eef4; --sub:#a9b6c3; --line:#2a3642;
  --blue:#4b93ec; --blue-ink:#08111c; --blue-soft:#15273d; --blue-line:#2d4f78;
  --green:#3cc486; --green-soft:#12291f;
  --gray:#3a4653; --gray-ink:#8795a3;
  --warn:#f0b35a; --warn-soft:#2b2211; --warn-line:#5a4520;
  --shadow:none; --bar-bg:rgba(20,28,37,.94);
}
html.big{--fs:19.5px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  /* 縦に並べ、短い画面でも下のバーが画面の一番下に来るようにする */
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.75;letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ===== 上部：現在地（コンパクト） ===== */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar-bg);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.where{display:block;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:10px 0 10px}
.where-row{display:flex;align-items:center;gap:10px;min-height:32px}
.pill{flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue);color:var(--blue-ink);white-space:nowrap}
.pill.done{background:var(--green)}
.where-title{flex:1;min-width:0;font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where-more{flex:none;font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
.segs{display:flex;gap:4px;margin-top:8px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--gray)}
.seg.done{background:var(--green)}
.seg.now{background:var(--blue)}

/* ===== 本文 ===== */
/* 下のバーの実際の高さ（--bb-h、JSで計測）＋余白ぶん空けて、最後の文章まで読めるようにする */
/* 下のバーは本文の後ろに置く（sticky）ので、最後までスクロールすれば必ず全文が見える */
main.wrap{flex:1 0 auto;width:100%;padding-top:18px;padding-bottom:40px}
/* LINE 内で開いたまま：画面下が LINE の操作部に隠れるので余白を多めにとる */
html.line main.wrap{padding-bottom:160px}
.inapp-note{display:none;margin:0;padding:10px 16px;background:var(--warn-soft);color:var(--ink);font-size:.9rem;line-height:1.6;border-bottom:1px solid var(--warn-line)}
html.line .inapp-note{display:block}
.screen{animation:inR .22s ease-out}
.screen.back{animation:inL .22s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
/* 画面切り替えアニメーション中に横スクロールが出ないようにする */
main.wrap{overflow-x:clip}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.screen,.screen.back{animation:none}}
.kicker{font-size:.85rem;font-weight:700;color:var(--blue);margin:0 0 4px}
h1{font-size:1.45rem;line-height:1.45;margin:0 0 12px;outline:none}
h2{font-size:1.1rem;margin:22px 0 10px}
p{margin:0 0 12px}
.lead{color:var(--sub);margin-bottom:18px}
.small{font-size:.88rem;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.card p:last-child{margin-bottom:0}
.term{display:block;font-size:.88rem;color:var(--sub);margin-top:4px}
.num-list{list-style:none;padding:0;margin:0 0 12px;counter-reset:n}
.num-list>li{counter-increment:n;position:relative;padding:12px 14px 12px 52px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.num-list>li::before{content:counter(n);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.num-list>li b{display:block}
.num-list>li .small{display:block;margin-top:2px}
.box{border-radius:16px;padding:14px 16px;margin:0 0 12px}
.box-next{background:var(--blue-soft);border:1px solid var(--blue-line)}
.box-next .box-h{color:var(--blue)}
.box-warn{background:var(--warn-soft);border:1px solid var(--warn-line)}
.box-warn .box-h{color:var(--warn)}
.box-ok{background:var(--green-soft);border:1px solid var(--green)}
.box-ok .box-h{color:var(--green)}
.box-h{font-weight:700;margin:0 0 6px;font-size:.95rem}
.box ul,.box ol{margin:0;padding-left:1.3em}
.box li{margin:2px 0}
.big-num{font-size:1.25rem;font-weight:700}
.example{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center;flex-wrap:wrap}
.example div{flex:1;min-width:90px}
.example .arrow{flex:none;min-width:0;color:var(--sub)}
.ex-h{font-weight:700;margin:0 0 2px}
.bars{margin:12px 0 4px}
.bar-row{margin:0 0 10px}
.bar-label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;margin:0 0 4px}
.bar-label b{white-space:nowrap}
.bar-track{height:22px;border-radius:6px;background:var(--bg)}
.gbar{height:100%;border-radius:6px}
.bar-pay{background:var(--warn)}
.bar-get{background:var(--green)}
.calc{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:.95rem}
.calc td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.calc td:last-child{text-align:right;white-space:nowrap;padding-left:8px;font-weight:700}
.nw{white-space:nowrap}
.ic-bg1{fill:var(--blue-soft)}
.ic-bg2{fill:var(--green-soft)}
.ic-bg3{fill:var(--warn-soft)}
.ic-doc{fill:var(--card);stroke:var(--sub);stroke-width:1.5}
.ic-line{stroke:var(--gray);stroke-width:2;stroke-linecap:round}
.ic-ok{fill:var(--green)}
.trio{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;margin:0 0 16px;text-align:center}
.trio>div{flex:1;min-width:0}
.trio svg{width:60px;height:60px;display:block;margin:0 auto 4px}
.trio .ar{flex:none;align-self:center;color:var(--sub);margin-top:-30px}
.trio b{display:block;font-size:.9rem;line-height:1.35}
.trio span{display:block;font-size:.76rem;color:var(--sub);line-height:1.4}
.tl{list-style:none;padding:0;margin:10px 0 6px}
.tl li{position:relative;padding:0 0 14px 28px}
.tl li::before{content:'';position:absolute;left:3px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.tl li::after{content:'';position:absolute;left:9px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:4px}
.tl li:last-child::after{display:none}
.tl li.good::before{background:var(--green)}
.tl li>b{display:block}
.tl li>span{display:block;font-size:.9rem;color:var(--sub)}
.calc-total{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0 8px;margin:10px 0 0;color:var(--green);font-size:1.1rem}

/* 結果カード */
.result{border-radius:20px;padding:18px;margin:0 0 14px;border:2px solid var(--blue);background:var(--card)}
.result .label{font-size:.85rem;color:var(--sub);margin:0}
.result .answer{font-size:1.35rem;font-weight:800;color:var(--blue);line-height:1.45;margin:2px 0 8px}
.result.gray{border-color:var(--gray)}
.result.gray .answer{color:var(--ink)}

/* 選択肢ボタン */
.choices{display:grid;gap:10px;margin:16px 0}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left;cursor:pointer;
  background:var(--card);border:2px solid var(--line);border-radius:16px;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow)}
.choice:active{transform:scale(.99)}
.choice:hover,.choice:focus-visible{border-color:var(--blue)}
.choice .c-sub{display:block;font-weight:400;font-size:.86rem;color:var(--sub);margin-top:2px}
.choice .c-txt{flex:1}
.choice::after{content:"›";font-size:1.6rem;color:var(--gray-ink);line-height:1}
.choice.selected{border-color:var(--blue);background:var(--blue-soft)}

/* 外部リンクボタン */
.ext{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:12px 16px;border-radius:16px;
  background:var(--card);border:2px solid var(--blue);color:var(--blue);font-weight:700;font-size:1.05rem;text-decoration:none;text-align:center;margin:0 0 8px}
.ext:active{transform:scale(.99)}
.ext .ico{font-size:.95rem}
.ext-note{font-size:.88rem;color:var(--sub);text-align:center;margin:0 0 16px}
.linkline{display:inline-block;padding:10px 0;min-height:44px}

/* サイトカード */
.site{display:flex;align-items:center;gap:12px}
.site .s-body{flex:1;min-width:0}
.site .s-name{font-weight:700}
.site .s-why{font-size:.88rem;color:var(--sub);display:block}
.mini-btn{flex:none;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);font-weight:700;cursor:pointer;font-size:.9rem}

/* チェックリスト */
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;min-height:56px}
.check input{width:24px;height:24px;flex:none;margin:2px 0 0;accent-color:var(--green)}

/* 全体の流れ */
.flow{list-style:none;padding:0;margin:0 0 16px}
.flow li{display:flex;gap:12px;align-items:stretch}
.flow .dotcol{display:flex;flex-direction:column;align-items:center;flex:none;width:34px}
.flow .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  background:var(--card);border:2px solid var(--gray);color:var(--gray-ink)}
.flow .bar{flex:1;width:2px;background:var(--gray);min-height:10px}
.flow li:last-child .bar{display:none}
.flow .done .dot{background:var(--green);border-color:var(--green);color:#fff}
.flow .done .bar{background:var(--green)}
.flow .now .dot{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.flow .txt{padding:4px 0 14px;flex:1;min-width:0}
.flow .txt b{display:block;line-height:1.4}
.flow .txt span{font-size:.86rem;color:var(--sub)}
.flow .state{font-size:.78rem;font-weight:700;margin-left:6px}
.flow .done .state{color:var(--green)}
.flow .now .state{color:var(--blue)}
.flow button.txt{border:0;background:none;text-align:left;cursor:pointer;padding:4px 0 14px}
.flow button.txt b{color:var(--blue);text-decoration:underline;text-underline-offset:3px}

/* ===== 下部固定：戻る / 次へ ===== */
.bottombar{position:sticky;bottom:0;z-index:20;background:var(--bar-bg);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bottombar .wrap{display:flex;gap:10px}
.btn{min-height:56px;border-radius:14px;font-weight:700;font-size:1.05rem;cursor:pointer;padding:8px 14px;border:2px solid transparent;line-height:1.35}
.btn:active{transform:scale(.99)}
.btn-back{flex:0 0 32%;background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-main{flex:1;background:var(--blue);color:var(--blue-ink)}
.btn-main.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--blue-line)}}
.btn-sub{width:100%;background:var(--card);border-color:var(--line);color:var(--ink);margin-top:4px}
.btn[hidden]{display:none}
.hint-back{font-size:.82rem;color:var(--sub);align-self:center;flex:1}

/* シート（全体一覧） */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:8px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out}
.sheet.open{transform:none}
.sheet-bg.open{display:block}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--gray);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{margin:0}
.close{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.opts .mini-btn{background:var(--card);color:var(--ink);border-color:var(--line)}
.opts .mini-btn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}

/* トースト */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bb-h, 92px) + 8px);z-index:30;max-width:528px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.2);
  opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}

.foot{font-size:.8rem;color:var(--sub);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}

/* 画像イラスト（AI生成・文字なし） */
.hero{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin:0 0 16px;background:var(--blue-soft)}
.done-pic{display:block;width:min(240px,70%);height:auto;aspect-ratio:1;border-radius:50%;margin:0 auto 10px;background:var(--green-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero,:root:not([data-theme="light"]) .done-pic{filter:brightness(.88)}}

/* はじめの画面の小さな操作（文字を大きく・教える） */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tools .mini-btn{background:var(--card);color:var(--ink);border-color:var(--line)}
.tools .mini-btn[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}

/* 折りたたみ（年収1,000万円の例・ホーム画面に追加の方法） */
details.more{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px}
details.more>summary{list-style:none;cursor:pointer;padding:14px 44px 14px 16px;font-weight:700;position:relative;min-height:48px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";position:absolute;right:16px;top:13px;color:var(--blue)}
details.more[open]>summary::after{content:"−"}
details.more>.more-body{padding:0 16px 14px}

/* ことばの説明 */
.yogo{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted var(--blue);text-decoration-thickness:2px;text-underline-offset:4px}
.yogo::after{content:"?";display:inline-flex;align-items:center;justify-content:center;width:1.05em;height:1.05em;margin-left:2px;border-radius:50%;
  background:var(--blue-soft);color:var(--blue);font-size:.72em;font-weight:700;vertical-align:.15em;text-decoration:none}
.gloss dt{font-weight:700;margin-top:12px}
.gloss dd{margin:2px 0 0;color:var(--sub);font-size:.95rem}

/* 寄付の記録 */
.log-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}
.log-sum>div{background:var(--bg);border-radius:12px;padding:8px 10px}
.log-sum b{display:block;font-size:1.1rem}
.log-list{list-style:none;padding:0;margin:0 0 10px}
.log-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.log-list .l-body{flex:1;min-width:0}
.log-list .l-city{font-weight:700;overflow-wrap:anywhere}
.log-list .l-meta{display:block;font-size:.85rem;color:var(--sub)}
.log-list label{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--sub);flex:none;cursor:pointer}
.log-list input{width:20px;height:20px;accent-color:var(--green)}
.log-del{flex:none;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.log-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.log-form label{font-size:.85rem;color:var(--sub);display:block}
.log-form .full{grid-column:1/-1}
.field{display:block;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:max(16px,1rem)}
.field:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn-add{width:100%;min-height:48px;background:var(--blue);color:var(--blue-ink)}

/* カレンダー登録 */
.cal-row{display:grid;gap:8px;margin:8px 0 0}
.cal-row .mini-btn{display:flex;align-items:center;justify-content:center;width:100%;text-align:center;text-decoration:none;line-height:1.4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<p class="inapp-note">LINEの中で開いているため、画面の下が隠れることがあります。右上（または右下）のメニューから「ブラウザで開く」「Safariで開く」を選ぶと読みやすくなります。</p>
<header class="topbar">
  <div class="wrap">
    <button class="where" id="where" type="button" aria-haspopup="dialog" aria-controls="sheet">
      <span class="where-row">
        <span class="pill" id="pill">はじめに</span>
        <span class="where-title" id="whereTitle">ふるさと納税かんたんナビ</span>
        <span class="where-more">全体 ▾</span>
      </span>
      <span class="segs" id="segs" aria-hidden="true"></span>
    </button>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>

<nav class="bottombar" aria-label="操作">
  <div class="wrap">
    <button class="btn btn-back" id="btnBack" type="button">← 戻る</button>
    <span class="hint-back" id="hintBack" hidden>答えを選ぶと次へ進みます</span>
    <button class="btn btn-main" id="btnMain" type="button">次へ →</button>

<div class="sheet-bg" id="sheetBg"></div>

  <div class="wrap">

    <div class="sheet-head">
      <h2 id="sheetTitle">全体の流れ</h2>
      <button class="close" id="sheetClose" type="button" aria-label="閉じる">✕</button>
    </div>
    <ol class="flow" id="sheetFlow"></ol>
    <div class="opts">
      <button class="mini-btn" id="optBig" type="button" aria-pressed="false">文字を大きく</button>
      <button class="mini-btn" type="button" data-act="gloss">ことばの説明</button>
      <button class="mini-btn" type="button" data-act="share">友だちに教える</button>
      <a class="mini-btn" href="qr.html" style="text-decoration:none;display:inline-flex;align-items:center">QRコード・配る用</a>
      <button class="mini-btn" id="optHome" type="button">はじめの画面へ</button>
      <button class="mini-btn" id="optReset" type="button">最初からやり直す</button>
    </div>
    <p class="small">青い文字のステップは、タップするとその画面へ戻れます。</p>
    <p class="small">版：2026-09-29</p>
  </div>
</div>

<div class="sheet-bg" id="gBg"></div>
<div class="sheet" id="gSheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="wrap">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2 id="gTitle">ことばの説明</h2>
      <button class="close" id="gClose" type="button" aria-label="閉じる">✕</button>
    </div>
    <div id="gBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- 定数 ---------- */
const STEPS = [
  { n:1, title:'ふるさと納税を知る',   desc:'しくみを1分で' },
  { n:2, title:'上限額を確認',         desc:'いくらまで寄付できるか' },
  { n:3, title:'手続方法を確認',       desc:'3つの質問に答える' },
  { n:4, title:'利用サイトを選ぶ',     desc:'2つの質問でおすすめを表示' },
  { n:5, title:'返礼品を選んで寄付',   desc:'サイトで申し込む' },
  { n:6, title:'控除の手続き',         desc:'寄付のあとに行う' },
  { n:7, title:'翌年、控除を確認',     desc:'翌年の5〜6月ごろ' }
];
const TOTAL = STEPS.length;

const URL = {
  simRakuten:'https://event.rakuten.co.jp/furusato/guide/simulation/',
  simChoice:'https://www.furusato-tax.jp/about/simulation',
  soumu:'https://www.soumu.go.jp/main_sosiki/jichi_zeisei/czaisei/czaisei_seido/furusato/mechanism/procedure.html',
  nta:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/1155.htm',
  ntaReturn:'https://www.nta.go.jp/taxes/shiraberu/shinkoku/tokushu/keisubetsu/furusato.htm',
  ntaCorner:'https://www.keisan.nta.go.jp/'
};

const SITES = {
  rakuten: { name:'楽天ふるさと納税', url:'https://event.rakuten.co.jp/furusato/',
             why:'いつもの楽天のアカウントと支払い方法で、そのまま寄付できます。' },
  choice:  { name:'ふるさとチョイス', url:'https://www.furusato-tax.jp/',
             why:'自治体や返礼品の情報が多く、見比べながら選びやすいサイトです。' },
  satofull:{ name:'さとふる', url:'https://www.satofull.jp/',
             why:'画面がシンプルで、はじめてでも手順を追いやすいサイトです。' },
  furunavi:{ name:'ふるなび', url:'https://furunavi.jp/',
             why:'大手サイトのひとつ。ほかのサイトと見比べたいときに。' }
};

const ROUTE_NAME = { one:'ワンストップ特例', tax:'確定申告', check:'まだ決めていない' };

/* ---------- 保存（進み具合だけ。氏名・住所・年収は扱わない） ---------- */
const KEY = 'furusatoNavi.v3';
const blank = () => ({ stack:['home'], a:{}, route:null, site:null, maxStage:0, checks:{} });
let S = blank();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && Array.isArray(o.stack) && o.stack.length) S = Object.assign(blank(), o); } }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function pref(k, v){
  try{ if(v === undefined) return localStorage.getItem('furusatoNavi.'+k); localStorage.setItem('furusatoNavi.'+k, v); }catch(e){ return null; }
}

/* ---------- 小物 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext = (url, label, note) =>
  `<a class="ext" href="${url}" target="_blank" rel="noopener" data-ext>${label}<span class="ico" aria-hidden="true">↗</span><span class="sr">（別のページが開きます）</span></a>` +
  (note ? `<p class="ext-note">${note}</p>` : '');
const choice = (val, label, sub) =>
  `<button class="choice" type="button" data-answer="${val}"><span class="c-txt">${label}${sub ? `<span class="c-sub">${sub}</span>` : ''}</span></button>`;
const cur = () => S.stack[S.stack.length - 1];
const route = () => S.route || 'check';
const site = () => SITES[S.site] || SITES.satofull;

/* ---------- 画面定義 ----------
   stage: 上部に表示するSTEP番号（0=はじめ, 8=完了）
   sub:   STEP内の小ステップ表示
   main:  下部の主ボタン（null=質問画面なので非表示） */
/* イラスト（飾り）。色は CSS 変数に合わせ、ダークモードでも見えるようにする */
const thisYear = () => new Date().getFullYear();
const GIFT = (x, y, k) => `<g transform="translate(${x} ${y}) scale(${k})">
  <rect x="0" y="12" width="48" height="34" rx="3" fill="#e5534b"/>
  <rect x="-5" y="3" width="58" height="12" rx="3" fill="#f06a63"/>
  <rect x="20" y="3" width="8" height="43" fill="#f5b940"/>
  <ellipse cx="16" cy="-1" rx="9" ry="5" fill="none" stroke="#f5b940" stroke-width="4"/>
  <ellipse cx="32" cy="-1" rx="9" ry="5" fill="none" stroke="#f5b940" stroke-width="4"/></g>`;
const IC_YEN = `<svg viewBox="0 0 60 60" aria-hidden="true"><circle class="ic-bg1" cx="30" cy="30" r="29"/>
  <circle cx="30" cy="30" r="16" fill="#f5b940"/><circle cx="30" cy="30" r="12" fill="none" stroke="#d99a1e" stroke-width="2"/>
  <path d="M24 22l6 8 6-8M30 30v10M24.5 32h11M24.5 36h11" fill="none" stroke="#8a5a00" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const IC_GIFT = `<svg viewBox="0 0 60 60" aria-hidden="true"><circle class="ic-bg2" cx="30" cy="30" r="29"/>${GIFT(18, 18, 0.5)}</svg>`;
const IC_TAX = `<svg viewBox="0 0 60 60" aria-hidden="true"><circle class="ic-bg3" cx="30" cy="30" r="29"/>
  <rect class="ic-doc" x="16" y="12" width="24" height="32" rx="3"/>
  <path class="ic-line" d="M21 20h14M21 26h14M21 32h9"/>
  <circle class="ic-ok" cx="40" cy="40" r="10"/>
  <path d="M40 34.5v10m-4.5-4.5l4.5 4.5 4.5-4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const APP_URL = 'https://tngmshr.github.io/furusato-navi/';

/* ---------- ことばの説明 ---------- */
const GLOSS = {
  jumin:  { w:'住民税', d:'住んでいる市区町村と都道府県に納める税金です。会社員は、6月から翌年5月までの毎月の給料から引かれます。ふるさと納税で主に安くなるのはこの税金です。' },
  kojo:   { w:'控除（こうじょ）', d:'税金を計算するときに差し引くことです。ふるさと納税では、上限額の範囲内なら「寄付額 − 2,000円」が所得税と住民税から差し引かれます。' },
  limit:  { w:'上限額', d:'自己負担が2,000円で済む寄付額の目安です。年収や家族構成で変わります。超えた分は自分の負担になります。' },
  one:    { w:'ワンストップ特例', d:'確定申告をしない会社員などが、寄付先の自治体に申請するだけで控除を受けられるしくみです。1年間の寄付先が5つ以内のときに使えます。期限は寄付した翌年の1月10日（必着）です。' },
  tax:    { w:'確定申告', d:'1年間の収入と税金を、自分で税務署に届け出る手続きです。期限は原則、翌年の3月15日です。ふるさと納税は「寄附金控除」として入れます。' },
  cert:   { w:'寄附金受領証明書', d:'寄付先の自治体が「寄付を受け取りました」と証明する書類です。確定申告で使うので、捨てずに保管します。' },
  kettei: { w:'決定通知書', d:'住民税の「税額決定通知書」です。1年分の住民税の額が書かれていて、会社員は5〜6月ごろに勤め先から渡されることが多いです。「寄附金税額控除」の欄で、ふるさと納税が反映されたか確かめられます。' },
  henrei: { w:'返礼品', d:'寄付のお礼に自治体から届く品物です。費用は寄付額の3割以下で、その地域の産品に限るというルールがあります。' }
};
const T = (k, label) => `<button class="yogo" type="button" data-term="${k}">${label || GLOSS[k].w}</button>`;

/* ---------- 寄付の記録（この端末の中だけに保存し、外には送らない） ---------- */
const LOG_KEY = 'furusatoNavi.log';
let LOG = { limit:0, items:[] };
function loadLog(){ try{ const o = JSON.parse(localStorage.getItem(LOG_KEY) || 'null'); if (o && Array.isArray(o.items)) LOG = o; }catch(e){} }
function saveLog(){ try{ localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); }catch(e){ toast('この端末には保存できませんでした。メモ帳に書いてください'); } }
const yen = n => Number(n).toLocaleString('ja-JP') + '円';
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
// 全角数字・カンマ・「円」を許して数値にする
const num = s => { const t = String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[,，、円\s]/g, ''); return /^\d{1,9}$/.test(t) ? +t : NaN; };
// 表示する寄付の年：いちばん新しい記録の年（なければ今年）
function logYear(){ return LOG.items.length ? Math.max(...LOG.items.map(i => +i.date.slice(0, 4))) : thisYear(); }
function logPanel(){
  const y = logYear();
  const items = LOG.items.filter(i => +i.date.slice(0, 4) === y).sort((a, b) => a.date < b.date ? -1 : 1);
  const older = LOG.items.length - items.length;
  const total = items.reduce((s, i) => s + i.amount, 0);
  const cities = new Set(items.map(i => i.city.replace(/\s/g, ''))).size;
  const lim = +LOG.limit || 0;
  const rest = lim - total;
  return `<div class="card" id="logPanel">
      <h3>寄付の記録（${y}年分）</h3>
      <p class="small" style="margin:0">この端末の中だけに保存し、外には送りません。</p>
      <div class="log-sum">
        <div><span class="small">寄付の合計</span><b>${yen(total)}</b>${lim ? `<span class="small">${rest >= 0 ? `上限の目安まで あと${yen(rest)}` : `<span class="warn-txt">上限の目安を${yen(-rest)}超えています</span>`}</span>` : ''}</div>
        <div><span class="small">寄付先の自治体</span><b>${cities}つ</b><span class="small">${cities > 5 ? '<span class="warn-txt">ワンストップ特例は使えません（確定申告へ）</span>' : 'ワンストップ特例は5つまで'}</span></div>
      </div>
      ${items.length ? `<ul class="log-list">${items.map(i => `
        <li><span class="l-body"><span class="l-city">${esc(i.city)}</span><span class="l-meta">${i.date.replace(/-/g, '/')}　${yen(i.amount)}</span></span>
          ${route() === 'one' ? `<label><input type="checkbox" data-logone="${i.id}" ${i.one ? 'checked' : ''}>申請済み</label>` : ''}
          <button class="log-del" type="button" data-logdel="${i.id}" aria-label="${esc(i.city)}の記録を消す">✕</button></li>`).join('')}</ul>`
        : '<p class="small">まだ記録はありません。寄付したら、下に入れてください。</p>'}
      <div class="log-form">
        <label class="full">寄付した自治体<input class="field" id="logCity" type="text" autocomplete="off" maxlength="40" placeholder="例：〇〇県△△町"></label>
        <label>金額（円）<input class="field" id="logAmt" type="text" inputmode="numeric" autocomplete="off" placeholder="10000"></label>
        <label>寄付した日<input class="field" id="logDate" type="date" value="${today()}"></label>
        <button class="btn btn-add full" type="button" data-act="logadd">記録する</button>
        <label class="full">上限額の目安（STEP 2で調べた額・入れなくても可）<input class="field" id="logLimit" type="text" inputmode="numeric" autocomplete="off" value="${lim || ''}" placeholder="60000"></label>
      </div>
      <p class="small" style="margin:0">ブラウザのデータを消したときや、長いあいだ開かなかったときに消えることがあります。念のため、紙やメモアプリにも残してください。</p>
      ${older ? `<button class="mini-btn" type="button" data-act="logold" style="margin-top:8px">${y}年より前の記録（${older}件）を消す</button>` : ''}
    </div>`;
}
function refreshLog(){ const p = $('logPanel'); if (p) p.outerHTML = logPanel(); }
function addLog(){
  const city = $('logCity').value.trim(), amount = num($('logAmt').value), date = $('logDate').value;
  if (!city){ toast('自治体名を入れてください'); $('logCity').focus(); return; }
  if (!(amount > 0)){ toast('金額を数字で入れてください（例：10000）'); $('logAmt').focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('寄付した日を選んでください'); return; }
  LOG.items.push({ id: Date.now().toString(36), city, amount, date, one:false });
  saveLog(); refreshLog(); toast(`${city}（${yen(amount)}）を記録しました`);
}

/* ---------- カレンダー登録（.ics と Googleカレンダー） ---------- */
let calYearSel = 0;
// 寄付した年：記録があればその年。なければ 1〜3月は前の年、4月以降は今年
function donationYear(){
  if (calYearSel) return calYearSel;
  if (LOG.items.length) return logYear();
  const d = new Date(); return d.getMonth() < 3 ? d.getFullYear() - 1 : d.getFullYear();
}
const ymd = d => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
const jdate = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
function calEvents(y){
  const ev = [];
  const r = route();
  if (r === 'one') ev.push({ d:new Date(y + 1, 0, 10), short:'ワンストップ特例の申請期限', alarm:'-P7D',
    title:'ふるさと納税：ワンストップ特例の申請期限（必着）',
    desc:`${y}年に寄付した自治体すべてに、申請書（またはオンライン申請）が届いているか確認します。` });
  if (r === 'tax'){
    const d = new Date(y + 1, 2, 15);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); // 土日なら翌平日
    ev.push({ d, short:'確定申告の期限', alarm:'-P7D',
      title:'ふるさと納税：確定申告の期限',
      desc:`${y}年の寄付を「寄附金控除」として確定申告に入れます。寄附金受領証明書を用意します。` });
  }
  ev.push({ d:new Date(y + 1, 5, 10), short:'控除されたか確認（住民税の決定通知書）', alarm:'PT9H',
    title:'ふるさと納税：控除されたか確認',
    desc:`5〜6月ごろに届く住民税の決定通知書で「寄附金税額控除」の欄を確認します（${y}年の寄付の分）。` });
  return ev;
}
// iCalendar の文字をエスケープし、75バイトごとに折り返す
const icsEsc = s => s.replace(/\\/g, '\\\\').replace(/[;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
function icsFold(line){
  const enc = new TextEncoder(); let out = '', cur = '', n = 0;
  for (const ch of line){ const b = enc.encode(ch).length; if (n + b > 73){ out += cur + '\r\n '; cur = ''; n = 1; } cur += ch; n += b; }
  return out + cur;
}
function makeIcs(y){
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//furusato-navi//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  calEvents(y).forEach((e, i) => {
    const end = new Date(e.d); end.setDate(end.getDate() + 1);
    lines.push('BEGIN:VEVENT', `UID:${ymd(e.d)}-${i}-${stamp}@furusato-navi`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${ymd(e.d)}`, `DTEND;VALUE=DATE:${ymd(end)}`,
      `SUMMARY:${icsEsc(e.title)}`, `DESCRIPTION:${icsEsc(e.desc + '\n手順はこちら：' + APP_URL)}`, `URL:${APP_URL}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(e.title)}`, `TRIGGER:${e.alarm}`, 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.map(icsFold).join('\r\n') + '\r\n';
}
function downloadIcs(){
  const blob = new Blob([makeIcs(donationYear())], { type:'text/calendar;charset=utf-8' });
  const u = window.URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = 'furusato-nouzei.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => window.URL.revokeObjectURL(u), 30000);
  toast('予定のファイルを保存しました。開いて「追加」を押してください');
}
function gcalUrl(e){
  const end = new Date(e.d); end.setDate(end.getDate() + 1);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.title)
    + `&dates=${ymd(e.d)}/${ymd(end)}&details=` + encodeURIComponent(e.desc + '\n手順はこちら：' + APP_URL);
}
function calBox(){
  const y = donationYear(), evs = calEvents(y);
  const years = [...new Set([thisYear() - 1, thisYear(), y])].sort();
  return `<div class="card" id="calBox">
      <h3>忘れないように、カレンダーに登録</h3>
      <ul class="small" style="margin:0;padding-left:1.2em">${evs.map(e => `<li>${jdate(e.d)}：${e.short}</li>`).join('')}</ul>
      <label class="small" style="display:block;margin-top:8px">寄付した年
        <select class="field" id="calYear">${years.map(v => `<option value="${v}" ${v === y ? 'selected' : ''}>${v}年</option>`).join('')}</select></label>
      <div class="cal-row">
        <button class="mini-btn" type="button" data-act="ics">スマホのカレンダーに登録</button>
        ${evs.map(e => `<a class="mini-btn" href="${esc(gcalUrl(e))}" target="_blank" rel="noopener">Googleカレンダー：${e.short}</a>`).join('')}
      </div>

let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  document.querySelectorAll('[data-act="install"]').forEach(b => b.hidden = false);
});
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBox(){
  if (standalone()) return '';
  return `<details class="more">
      <summary>ホーム画面に追加しておく</summary>
      <div class="more-body">
        <p class="small">アプリのように1タップで開けます。翌年の確認（STEP 7）のときにも迷わず戻ってこられます。</p>
        <button class="btn btn-add" type="button" data-act="install" ${installEvt ? '' : 'hidden'}>ホーム画面に追加する</button>
        ${isIOS() ? `<ol class="small" style="padding-left:1.3em;margin:8px 0 0">
          <li>共有ボタン（四角から上向きの矢印）を押します。見当たらないときは「…」を押すと出てきます</li>
          <li>「ホーム画面に追加」を選びます</li>
          <li>右上の「追加」を押します</li></ol>`
        : `<p class="small" style="margin:8px 0 0">ボタンが出ないときは、ブラウザのメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」を選びます。</p>`}
      </div>
    </details>`;
}

/* ---------- 文字の大きさ・教える ---------- */
const isBig = () => document.documentElement.classList.contains('big');
function toggleBig(){
  const on = !isBig();
  document.documentElement.classList.toggle('big', on);
  document.querySelectorAll('#optBig,[data-act="big"]').forEach(b => b.setAttribute('aria-pressed', on));
  pref('big', on ? '1' : '0');
}
async function share(){
  const data = { title:'ふるさと納税かんたんナビ', text:'はじめてのふるさと納税を、寄付から税金の手続きまで7つのステップで案内してくれるナビです。', url:APP_URL };
  if (navigator.share){ try{ await navigator.share(data); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(APP_URL); toast('URLをコピーしました。LINEやメールに貼り付けて送れます'); }
  catch(e){ window.prompt('このURLをコピーして送ってください', APP_URL); }
}

/* 小ステップ画面を持つSTEPの入口 */
const STAGE_ENTRY = { 1:'s1', 2:'s2', 3:'s3q1', 4:'s4q1', 5:'s5', 6:'s6', 7:'s7' };

function checkItem(id, label, sub){
  return `<label class="check"><input type="checkbox" data-check="${id}" ${S.checks[id] ? 'checked' : ''}>
    <span>${label}${sub ? `<br><span class="small">${sub}</span>` : ''}</span></label>`;
}

function stageOf(id){ return SCREENS[id] ? SCREENS[id].stage : 0; }
function curStage(){ return stageOf(cur()); }

// 「続きから」で戻る画面の STEP 番号（なければ 0）
function resumeStage(){ return S.resume ? stageOf(S.resume[S.resume.length - 1]) : 0; }

function stateOf(n){
  const st = curStage();
  if (st === 8 || n < st) return 'done';
  if (n === st) return 'now';
  return 'todo';
}

function flowItems(linkable){
  const st = curStage();
  return STEPS.map(s => {
    let cls = 'todo';
    if (st === 0){ const r = resumeStage(); cls = !r ? 'todo' : (s.n < r || r === 8) ? 'done' : s.n === r ? 'now' : 'todo'; }
    else cls = stateOf(s.n);
    const label = cls === 'done' ? '完了' : cls === 'now' ? (st === 0 ? '続きはここから' : 'いまここ') : '';
    const mark = cls === 'done' ? '✓' : s.n;
    const canJump = linkable && s.n <= S.maxStage && s.n !== st;
    const body = `<b>${s.title}${label ? `<span class="state">${label}</span>` : ''}</b><span>${s.desc}</span>`;
    return `<li class="${cls}"><span class="dotcol"><span class="dot">${mark}</span><span class="bar"></span></span>${
      canJump ? `<button class="txt" type="button" data-jump="${s.n}">${body}</button>` : `<span class="txt">${body}</span>`}</li>`;
  }).join('');
}

/* ---------- 表示 ---------- */
let lastDir = 'fwd';
function render(){
  const id = cur(), sc = SCREENS[id] || SCREENS.home;
  const st = sc.stage;
  if (st > S.maxStage) S.maxStage = st;
  save();

  // 上部：現在地
  const pill = $('pill'), title = $('whereTitle');
  pill.classList.toggle('done', st === 8);
  pill.hidden = st === 0;
  if (st === 0){ pill.textContent = 'はじめに'; title.textContent = 'ふるさと納税かんたんナビ'; }
  else if (st === 8){ pill.textContent = '完了'; title.textContent = 'すべて完了'; }
  else { pill.textContent = `STEP ${st} / ${TOTAL}`; title.textContent = STEPS[st-1].title; }
  $('segs').innerHTML = STEPS.map(s => `<span class="seg ${st === 0 ? '' : stateOf(s.n)}"></span>`).join('');
  $('where').setAttribute('aria-label', `現在地：${pill.textContent} ${title.textContent}${sc.sub ? ' ' + sc.sub : ''}。タップで全体の流れを表示`);

  // 本文
  const main = $('main');
  main.innerHTML = `<section class="screen ${lastDir === 'back' ? 'back' : ''}">${sc.html()}</section>`;
  window.scrollTo(0, 0);
  const f = main.querySelector('#focusMe') || main.querySelector('h1');
  if (f) try{ f.focus({preventScroll:true}); }catch(e){}

  // 下部：戻る / 次へ
  const m = sc.main ? sc.main() : null;
  const bMain = $('btnMain'), bBack = $('btnBack');
  bBack.hidden = S.stack.length <= 1;
  $('hintBack').hidden = !!m || bBack.hidden;
  bMain.hidden = !m;
  if (m){ bMain.textContent = m.label; bMain.dataset.go = m.go || ''; bMain.dataset.act = m.act || ''; }
  bMain.classList.remove('pulse');
  bBack.style.flex = m ? '' : '0 0 40%';
}

/* ---------- 画面遷移（Androidの戻るボタンにも対応） ---------- */
function go(id){
  if (!SCREENS[id]) return;
  const wasRoot = S.stack.length <= 1;
  if (wasRoot) delete S.resume;
  S.stack.push(id);
  if (wasRoot) try{ history.pushState({furusato:1}, ''); }catch(e){}
  lastDir = 'fwd'; render();
}
function popScreen(){
  if (S.stack.length <= 1) return;
  S.stack.pop();
  lastDir = 'back'; render();
  if (S.stack.length > 1) try{ history.pushState({furusato:1}, ''); }catch(e){}
}
window.addEventListener('popstate', () => {
  // 全体の流れ・ことばの説明が開いているときは、閉じるだけで画面は戻さない
  if ($('sheet').classList.contains('open') || $('gSheet').classList.contains('open')){
    closeSheet(); closeGloss();
    if (S.stack.length > 1) try{ history.pushState({furusato:1}, ''); }catch(e){}
    return;
  }
  popScreen();
});
function back(){
  if (S.stack.length <= 1) return;
  if (history.state && history.state.furusato) history.back(); else popScreen();
}
function goHome(){
  if (cur() !== 'home') S.resume = S.stack.slice();
  S.stack = ['home']; lastDir = 'back'; render();
}
function resume(){
  if (!S.resume) return go('s1');
  S.stack = S.resume; delete S.resume;
  try{ history.pushState({furusato:1}, ''); }catch(e){}
  lastDir = 'fwd'; render();
}
function resetAll(){
  if (!confirm('進み具合を消して、最初からやり直しますか？')) return;
  S = blank(); save(); closeSheet(); lastDir = 'back'; render();
}

/* ---------- 回答の処理 ---------- */
function answer(id, v){
  S.a[id] = v;
  switch (id){
    case 's3q1': if (v === 'no') return go('s3q2'); S.route = v === 'yes' ? 'tax' : 'check'; return go('s3r');
    case 's3q2': if (v === 'no') return go('s3q3'); S.route = v === 'yes' ? 'tax' : 'check'; return go('s3r');
    case 's3q3': S.route = v === 'le5' ? 'one' : 'tax'; return go('s3r');
    case 's4q1': if (v === 'yes'){ S.site = S.rec = 'rakuten'; return go('s4r'); } return go('s4q2');
    case 's4q2': S.site = S.rec = v === 'compare' ? 'choice' : 'satofull'; return go('s4r');
    case 's6':   S.route = v; lastDir = 'fwd'; return render();
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button,a,label');
  if (!t) return;
  if (t.dataset.answer){ answer(cur(), t.dataset.answer); return; }
  if (t.dataset.site){ S.site = t.dataset.site; lastDir = 'fwd'; render(); toast(`${SITES[S.site].name}に変更しました`); return; }
  if (t.dataset.jump){ closeSheet(); const tgt = STAGE_ENTRY[t.dataset.jump]; if (tgt) go(tgt); return; }
  if (t.dataset.act === 'reset'){ resetAll(); return; }
  if (t.dataset.act === 'redo3'){
    const i = S.stack.lastIndexOf('s3q1');
    if (i > 0){ S.stack = S.stack.slice(0, i + 1); lastDir = 'back'; render(); } else go('s3q1');
    return;
  }
  if (t.dataset.term){ openGloss(t.dataset.term); return; }
  if (t.dataset.logdel){
    const it = LOG.items.find(i => i.id === t.dataset.logdel);
    if (it && confirm(`${it.city}（${yen(it.amount)}）の記録を消しますか？`)){ LOG.items = LOG.items.filter(i => i !== it); saveLog(); refreshLog(); }
    return;
  }
  switch (t.dataset.act){
    case 'gloss': closeSheet(); openGloss(); return;
    case 'share': share(); return;
    case 'big': toggleBig(); return;
    case 'ics': downloadIcs(); return;
    case 'logadd': addLog(); return;
    case 'logold': {
      const y = logYear();
      if (confirm(`${y}年より前の記録を消しますか？`)){ LOG.items = LOG.items.filter(i => +i.date.slice(0, 4) >= y); saveLog(); refreshLog(); }
      return;
    }
    case 'install':
      if (installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; t.hidden = true; }); }
      return;
  }
  if (t.hasAttribute('data-ext')){ awayAt = Date.now(); return; }
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-check]');
  if (c){ S.checks[c.dataset.check] = c.checked; save(); return; }
  const lo = e.target.closest('[data-logone]');
  if (lo){ const it = LOG.items.find(i => i.id === lo.dataset.logone); if (it){ it.one = lo.checked; saveLog(); } return; }
  if (e.target.id === 'logLimit'){ const v = num(e.target.value); LOG.limit = v > 0 ? v : 0; saveLog(); refreshLog(); return; }
  if (e.target.id === 'calYear'){ calYearSel = +e.target.value; const b = $('calBox'); if (b) b.outerHTML = calBox(); $('calYear').focus(); }
});
// 金額欄で Enter を押したら記録する
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'logAmt' || e.target.id === 'logCity') && !e.isComposing){ e.preventDefault(); addLog(); }
});

$('btnBack').addEventListener('click', back);
$('btnMain').addEventListener('click', () => {
  const b = $('btnMain');
  if (b.dataset.act === 'home') return goHome();
  if (b.dataset.act === 'resume') return resume();
  if (b.dataset.go) go(b.dataset.go);
});

/* ---------- 外部サイトから戻ったとき ---------- */
let awayAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !awayAt) return;
  if (Date.now() - awayAt < 1500) return;
  awayAt = 0;
  const m = SCREENS[cur()].main ? SCREENS[cur()].main() : null;
  toast(m ? `おかえりなさい。終わったら「${m.label.replace(/ →$/,'')}」を押してください` : 'おかえりなさい。続きから進めてください');
  if (m){ const b = $('btnMain'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
});

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

/* ---------- 全体シート ---------- */
function openSheet(){
  $('sheetFlow').innerHTML = flowItems(true);
  $('sheet').classList.add('open'); $('sheetBg').classList.add('open');
  $('sheetClose').focus();
}
function closeSheet(){ $('sheet').classList.remove('open'); $('sheetBg').classList.remove('open'); }

/* ことばの説明（1語、または一覧） */
let glossFrom = null;
function openGloss(k){
  glossFrom = document.activeElement;
  const one = k && GLOSS[k];
  $('gTitle').textContent = one ? GLOSS[k].w : 'ことばの説明';
  $('gBody').innerHTML = one
    ? `<p>${GLOSS[k].d}</p><button class="mini-btn" type="button" data-act="gloss">ほかのことばも見る</button>`
    : `<dl class="gloss">${Object.values(GLOSS).map(g => `<dt>${g.w}</dt><dd>${g.d}</dd>`).join('')}</dl>`;
  $('gSheet').classList.add('open'); $('gBg').classList.add('open');
  $('gSheet').scrollTop = 0;
  $('gClose').focus();
}
function closeGloss(){
  $('gSheet').classList.remove('open'); $('gBg').classList.remove('open');
  if (glossFrom && glossFrom.focus) try{ glossFrom.focus({preventScroll:true}); }catch(e){}
}
$('gClose').addEventListener('click', closeGloss);
$('gBg').addEventListener('click', closeGloss);
$('where').addEventListener('click', openSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('sheetBg').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSheet(); closeGloss(); } });
$('optHome').addEventListener('click', () => { closeSheet(); goHome(); });
$('optReset').addEventListener('click', resetAll);
$('optBig').addEventListener('click', toggleBig);

/* ---------- 起動 ---------- */
load();
loadLog();
// オフラインでも開けるようにする（sw.js は「まずネット、だめなら保存分」）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (pref('big') === '1'){ document.documentElement.classList.add('big'); $('optBig').setAttribute('aria-pressed', 'true'); }
// 再訪時は「はじめ」画面（全体像＋続きから）を見せる
if (cur() !== 'home'){ S.resume = S.stack.slice(); S.stack = ['home']; }
/* 下のバーの高さを測って本文の下余白に使う（文字拡大・折り返し・iPhoneのホームバー分も含む） */
(function(){
  const bb = document.querySelector('.bottombar');
  const set = () => document.documentElement.style.setProperty('--bb-h', bb.getBoundingClientRect().height + 'px');
  set();
  if (window.ResizeObserver) new ResizeObserver(set).observe(bb);
  window.addEventListener('resize', set);
})();
render();
})();
</script>
</body>
